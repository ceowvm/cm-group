name: Quality checks

on:
  push:
    branches: [main, production-ready]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f logo.png
          test -f api/profile.php
          test -f api/event.php
          test -f api/health.php
